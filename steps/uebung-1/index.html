<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbindungssuche – Crash Course Modern (DB) Web</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!--
      Übung Block 1 – Semantisches HTML & Barrierefreiheit
      Eure Aufgaben: erst AUFGABE-BASIS.md, danach AUFGABE-PLUS.md (baut darauf auf).
    -->

    <!-- Skip-Link: erstes fokussierbares Element, springt direkt zum Inhalt -->
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <header>
      <p><strong>DB Reiseauskunft</strong> – Crash Course Demo</p>
    </header>

    <main id="main">
      <h1>Verbindungssuche</h1>

      <!-- method="get": Beim Absenden landen die Eingaben in der URL (?from=…&to=…) -->
      <form id="search-form" method="get" aria-labelledby="search-heading">
        <h2 id="search-heading">Wohin möchtest du reisen?</h2>

        <!-- ✅ Muster: Ein Eingabefeld mit Beschriftung (label) und Hinweis.
             for="from" am <label> verbindet es mit id="from" am <input>. -->
        <p>
          <label for="from">Von</label>
          <input id="from" name="from" type="text" autocomplete="off" required aria-describedby="from-hint" />
          <small id="from-hint">Bahnhof oder Haltestelle, z. B. Frankfurt(Main)Hbf</small>
        </p>

        <!-- Ab hier kommen eure Formularfelder hin -->
      </form>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Verbindungen</h2>
        <p>Noch keine Suche gestartet.</p>
      </section>
    </main>

    <footer>
      <p>Crash Course Modern (DB) Web · Übungsprojekt</p>
    </footer>
  </body>
</html>
