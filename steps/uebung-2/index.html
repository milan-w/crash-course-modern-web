<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbindungssuche – Crash Course Modern (DB) Web</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <!--
      Übung Block 2 – DB UX als Baustein
      Eure Aufgaben: erst AUFGABE-BASIS.md, danach AUFGABE-PLUS.md (baut darauf auf).
    -->
    <!-- Skip-Link: erstes fokussierbares Element, springt direkt zum Inhalt -->
    <a class="skip-link" href="#main">Zum Inhalt springen</a>

    <header>
      <p><strong>DB Reiseauskunft</strong> – Crash Course Demo</p>
    </header>

    <main id="main">
      <h1>Verbindungssuche</h1>

      <!-- method="get": Beim Absenden landen die Eingaben in der URL (?from=…&to=…).
           novalidate NICHT setzen: Wir nutzen die native Browser-Validierung -->
      <form id="search-form" method="get" aria-labelledby="search-heading">
        <h2 id="search-heading">Wohin möchtest du reisen?</h2>

        <p>
          <label for="from">Von</label>
          <input
            id="from"
            name="from"
            type="text"
            list="stations"
            autocomplete="off"
            required
            aria-describedby="from-hint"
          />
          <small id="from-hint">Bahnhof oder Haltestelle, z. B. Frankfurt(Main)Hbf</small>
        </p>

        <!-- Buttons brauchen einen zugänglichen Namen. Hier: sichtbarer Text. -->
        <button type="button">Start und Ziel tauschen</button>

        <p>
          <label for="to">Nach</label>
          <input id="to" name="to" type="text" list="stations" autocomplete="off" required />
        </p>

        <!-- Native Vorschlagsliste – barrierefrei, ohne eine Zeile JavaScript -->
        <datalist id="stations">
          <option value="Frankfurt(Main)Hbf"></option>
          <option value="Köln Hbf"></option>
          <option value="Berlin Hbf"></option>
          <option value="Hamburg Hbf"></option>
          <option value="München Hbf"></option>
        </datalist>

        <!-- Zusammengehörige Radios IMMER mit fieldset + legend gruppieren -->
        <fieldset>
          <legend>Zeitpunkt</legend>
          <p>
            <input id="anchor-departure" type="radio" name="anchor" value="departure" checked />
            <label for="anchor-departure">Abfahrt</label>
            <input id="anchor-arrival" type="radio" name="anchor" value="arrival" />
            <label for="anchor-arrival">Ankunft</label>
          </p>
          <p>
            <label for="datetime">Datum und Uhrzeit</label>
            <input id="datetime" name="datetime" type="datetime-local" required />
          </p>
        </fieldset>

        <!-- details/summary: Auf- und Zuklappen ohne eine Zeile JavaScript -->
        <details>
          <summary>Weitere Optionen</summary>
          <p>
            <input id="direct" name="direct" type="checkbox" />
            <label for="direct">Nur Direktverbindungen</label>
          </p>
        </details>

        <button type="submit">Verbindungen suchen</button>
      </form>

      <section aria-labelledby="results-heading">
        <h2 id="results-heading">Verbindungen</h2>
        <p>Noch keine Suche gestartet.</p>
      </section>
    </main>

    <footer>
      <p>Crash Course Modern (DB) Web · Übungsprojekt</p>
    </footer>
  </body>
</html>
